
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EventBooking</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, #704c743d, transparent 30%),
                radial-gradient(circle at 85% 80%, #ffab7640, transparent 30%),
                linear-gradient(135deg, #17172f, #292044, #512e50);
            color: #242039;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            color: white;
        }

        .logo { font-size: 25px; font-weight: 800; }
        .logo span { color: #ffab76; }
        header a { color: white; text-decoration: none; }

        main {
            width: calc(100% - 32px);
            max-width: 440px;
            margin: 30px auto 55px;
            padding: 35px;
            border: 1px solid #ffffff66;
            border-radius: 22px;
            background: #fffffffa;
            box-shadow: 0 25px 70px #00000040;
        }

        .tag {
            color: #d95345;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 { font-size: 30px; margin-bottom: 10px; }
        .subtitle { color: #777487; line-height: 1.6; margin-bottom: 20px; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dedbe7;
            border-radius: 9px;
            background: #faf9fc;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e9784c;
            box-shadow: 0 0 0 3px #e9784c20;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: linear-gradient(100deg, #ef8757, #d95345);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: .65; cursor: wait; }

        #message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .bottom {
            margin-top: 22px;
            text-align: center;
            color: #777487;
            font-size: 14px;
        }

        .bottom a { color: #d95345; font-weight: bold; text-decoration: none; }
    </style>
</head>

<body>
<header>
    <div class="logo">Event<span>Booking.</span></div>
    <a href="index.html">Home</a>
</header>

<main>
    <p class="tag">JOIN EVENTBOOKING</p>
    <h1>Create account</h1>
    <p class="subtitle">Register to discover events and book your tickets.</p>

    <form id="registerForm">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input id="email" type="email" placeholder="you@example.com"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Create a password"
               minlength="6" autocomplete="new-password" required>

        <button id="registerButton" type="submit">Create Account →</button>
        <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p class="bottom">
        Already registered? <a href="login.html">Login</a>
    </p>
</main>

<script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!name || !email || !password) {
            message.style.color = "#c62828";
            message.textContent = "Please fill in all fields.";
            return;
        }

        button.disabled = true;
        button.textContent = "Creating account...";
        message.textContent = "";

        try {
            const response = await fetch(
                "http://localhost:8081/api/users/register",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                }
            );

            const text = await response.text();

            if (!response.ok) {
                throw new Error(
                    "Registration failed (" + response.status + "). " +
                    (text || "Please check your User entity and backend.")
                );
            }

            message.style.color = "#18834b";
            message.textContent = "Registration successful! Redirecting to login...";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);

        } catch (error) {
            message.style.color = "#c62828";
            message.textContent = error.message.includes("Failed to fetch")
                ? "Cannot connect to backend. Check whether Spring Boot is running on port 8081."
                : error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Create Account →";
        }
    });
</script>
</body>
</html>
